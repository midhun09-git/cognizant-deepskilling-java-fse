<section class="page-card">
    <h1>Available Courses</h1>

    <div class="course-grid">
        <app-course-card *ngFor="let c of courses" [course]="c" (enrollRequested)="onEnroll($event)">
        </app-course-card>
    </div>

    <p class="selected" *ngIf="selectedCourseId">
        Selected course ID: {{ selectedCourseId }}
    </p>
</section>
