<section class="courses-page">
    <div class="courses-header">
        <p class="eyebrow">Student Learning Dashboard</p>
        <h1>Available Courses</h1>
        <p class="subtitle">
            Choose a course, view its status, and enroll from one clean dashboard.
        </p>

        <div class="search-panel">
            <input type="text" placeholder="Search by course name or code" [(ngModel)]="searchTerm"
                (input)="onSearchChange()">
        </div>
    </div>

    <p class="loading-text" *ngIf="isLoading">Loading courses...</p>

    <ng-container *ngIf="!isLoading">
        <div class="course-grid" *ngIf="filteredCourses.length > 0; else noCourses">
            <app-course-card appHighlight="#eff6ff" *ngFor="let course of filteredCourses; trackBy: trackByCourseId"
                [course]="course" [enrolled]="isEnrolled(course.id)" (enrollRequested)="onEnroll($event)"
                (viewRequested)="openDetails($event)">
            </app-course-card>
        </div>

        <ng-template #noCourses>
            <p class="empty-text">No courses found.</p>
        </ng-template>
    </ng-container>

    <div class="selected-box" *ngIf="selectedCourseId">
        Selected course ID: {{ selectedCourseId }}
    </div>
</section>
