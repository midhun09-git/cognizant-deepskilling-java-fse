<section class="hero">
    <h1>Welcome to {{ portalName }}</h1>

    <p>
        This portal helps students view courses, enroll, check grades,
        and manage their profile.
    </p>

    <button [disabled]="!isPortalActive" (click)="onEnrollClick()">
        Enroll Now
    </button>


    <div class="search-box">
        <label>Search Course: </label>

        <!-- [property] is one-way binding: component to DOM.
         [(ngModel)] is two-way binding: DOM to component and component to DOM. -->
        <input type="text" [(ngModel)]="searchTerm" placeholder="Enter course name">

        <p>Searching for: {{ searchTerm }}</p>
    </div>

    <div class="stats-container">
        <div class="stat-card">
            <h2>{{ availableCourses }}</h2>
            <p>Courses Available</p>
        </div>

        <div class="stat-card">
            <h2>3</h2>
            <p>Enrolled</p>
        </div>

        <div class="stat-card">
            <h2>3.8</h2>
            <p>GPA</p>
        </div>
    </div>
</section>
