<div class="course-card" [ngClass]="cardClasses" [ngStyle]="borderStyle">
    <div class="card-top">
        <div>
            <p class="course-code">{{ course.code }}</p>
            <h2>{{ course.name }}</h2>
        </div>

        <div [ngSwitch]="course.gradeStatus">
            <span *ngSwitchCase="'passed'" class="badge passed">Passed</span>
            <span *ngSwitchCase="'failed'" class="badge failed">Failed</span>
            <span *ngSwitchCase="'pending'" class="badge pending">Pending</span>
        </div>
    </div>

    <div class="info-row">
        <span>Credits</span>
        <strong>{{ course.credits | creditLabel }}</strong>
    </div>

    <div class="info-row">
        <span>Status</span>
        <strong>{{ enrolled ? 'Enrolled' : 'Not enrolled' }}</strong>
    </div>

    <div class="button-row">
        <button class="enroll-btn" (click)="enroll($event)">
            {{ enrolled ? 'Unenroll' : 'Enroll' }}
        </button>

        <button class="details-btn" (click)="viewDetails($event)">
            View Details
        </button>

        <button class="details-btn" (click)="toggleDetails($event)">
            {{ isExpanded ? 'Hide' : 'Quick Info' }}
        </button>
    </div>

    <p *ngIf="isExpanded" class="details">
        {{ course.description }}
    </p>
</div>
